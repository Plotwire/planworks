<!--
  Supabase -> Authentication -> Emails -> "Reset password"
  Subject: Reset your Plotwire password
  Paste everything below this comment into the message body.

  The link goes straight to the app (app/auth/confirm/page.jsx), which checks
  it with verifyOtp and opens the "Set a new password" screen. Only switch to
  this template once that page handles reset links on app.plotwire.uk (i.e.
  after the reset-email-preview branch is merged), or resets will fail.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F6F9;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border:1px solid #E6EBF1;border-radius:12px;">
        <tr>
          <td style="padding:28px 32px 8px;font-size:22px;color:#1A2530;">
            Plot<strong style="color:#2C97A8;">wire</strong>
          </td>
        </tr>
        <tr>
          <td style="padding:8px 32px 0;">
            <h1 style="margin:0 0 12px;font-size:20px;color:#1A2530;">Reset your password</h1>
            <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#3A4654;">
              We received a request to reset the password for your Plotwire account. Choose a new one below.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px;">
            <a href="https://app.plotwire.uk/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
               style="display:inline-block;background:#2C97A8;color:#1A2530;font-size:15px;font-weight:bold;text-decoration:none;padding:13px 26px;border-radius:10px;">
              Choose a new password
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 28px;font-size:13px;line-height:1.6;color:#697785;">
            If you didn't ask to reset your password, you can ignore this email &mdash; your password won't change.
          </td>
        </tr>
      </table>
      <p style="margin:16px 0 0;font-size:12px;color:#9AA6B2;">Plotwire &middot; admin@plotwire.uk</p>
    </td>
  </tr>
</table>
